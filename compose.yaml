services:
  # ==============================================================
  # FastAPI Backend Service (Stateless Agents & LLM Execution)
  # ==============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mortgage_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      # LLM Engine: connect to local Windows host Ollama via host.docker.internal
      - LLM_MODE=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      # (Optional) vLLM endpoint configuration if switching LLM_MODE to vllm
      - VLLM_BASE_URL=http://host.docker.internal:8000/v1
      - VLLM_MODEL=qwen2.5:1.5b
      - VLLM_API_KEY=EMPTY
      - VLLM_TIMEOUT_SECONDS=120
    extra_hosts:
      # Allows containers to access host services (like host Ollama) on Windows, Mac, and Linux
      - "host.docker.internal:host-gateway"
    volumes:
      - ./exports:/app/exports
